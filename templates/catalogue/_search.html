<div class="public-search container" data-search-root>
<button type="button" class="header-search-trigger" data-search-open aria-expanded="false" aria-controls="header-search-panel"><span aria-hidden="true">⌕</span> Search products &amp; services</button>
<div class="search-backdrop" data-search-backdrop hidden></div>
<section id="header-search-panel" class="header-search-panel" role="dialog" aria-modal="true" aria-label="Search products and services" hidden>
<div class="search-panel-inner"><form action="{% url 'catalogue:product_list' %}" method="get" role="search" data-public-search data-endpoint="{% url 'catalogue:search_suggestions' %}">
<div class="search-panel-row"><label class="sr-only" for="public-search">Search product, model, brand or service</label><input id="public-search" type="search" name="q" maxlength="100" placeholder="Search product, model, brand or service" autocomplete="off" aria-controls="search-suggestions"><button class="button">Search</button><button type="button" data-search-close aria-label="Close search">×</button></div>
<div class="search-options"><fieldset><legend class="sr-only">Search in</legend><span>SEARCH IN</span><label><input type="checkbox" name="type" value="products" checked> Products</label><label><input type="checkbox" name="type" value="services" checked> Services</label><label><input type="checkbox" name="type" value="categories" checked> Categories</label><label><input type="checkbox" name="type" value="pages" checked> Pages</label></fieldset><label class="sr-only" for="search-category">Product category</label><select name="category" id="search-category"><option value="">All product categories</option></select></div>
<p data-search-status role="status">Start typing or choose a recent or featured product.</p><div id="search-suggestions" data-search-links></div>
<div data-search-discovery><section data-recent-section hidden><h3>Recent searches <button type="button" data-clear-recent>Clear</button></h3><div data-recent-links class="search-chips"></div></section><section data-recommended-section hidden><h3>Featured products</h3><div data-recommended-links class="search-chips"></div></section></div>
</form></div></section></div>
